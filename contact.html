<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <section class="intro-section">
            <h1 class="intro-section__heading">Navaneetham</h1>
            <p class="intro-section__subtitle">Web Developer</p>
            <a class="intro-section__link" href="index.html">Home</a>
        </section>
        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>
                            <label>Name:</label>
                        </td>
                        <td>
                            <input type="text" placeholder="Enter your Name" class="contact-form__input">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label>Email:</label>
                        </td>
                        <td>
                            <input type="email" placeholder="Enter your Email" class="contact-form__input">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label>Message:</label>
                        </td>
                        <td>
                            <textarea placeholder="Message" class="contact-form__textarea"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td>
                            <button type="submit" class="contact-form__submit">Submit</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <br>

        <section class="footer">
            <p class="footer__title">
                Social Media:
                <a href="#">Instagram</a> ,
                <a href="#">LinkedIn</a>
            </p>

            <p class="footer__copyright">&copy; Navaneetham</p>
        </section>

    </div>


</body>

</html>
